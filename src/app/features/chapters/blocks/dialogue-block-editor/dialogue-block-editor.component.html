<div class="fields">
    <label class="character">
        <span class="eyebrow">Character</span>
        <select [ngModel]="block.characterId" (ngModelChange)="patch.emit({ characterId: $event })">
            <option value="" disabled>Choose a character...</option>
            @for (char of characters; track char.id) {
            <option [value]="char.id">{{ char.name }}</option>
            }
        </select>
    </label>

    <label class="align">
        <span class="eyebrow">Nameplate</span>
        <div class="align-toggle">
            <button type="button" class="btn subtle" [class.active]="block.align === 'left'"
                (click)="patch.emit({ align: 'left' })">
                Left
            </button>
            <button type="button" class="btn subtle" [class.active]="block.align === 'right'"
                (click)="patch.emit({ align: 'right' })">
                Right
            </button>
        </div>
    </label>
</div>

<div class="text-field">
    <span class="eyebrow">Line</span>
    <div class="toolbar">
        <button type="button" class="btn subtle" (mousedown)="$event.preventDefault()" (click)="exec('bold')">
            <app-icon icon="bold"></app-icon>
        </button>
        <button type="button" class="btn subtle" (mousedown)="$event.preventDefault()" (click)="exec('italic')">
            <app-icon icon="italic"></app-icon>
        </button>
        <button type="button" class="btn subtle" (mousedown)="$event.preventDefault()" (click)="exec('underline')">
            <app-icon icon="underline"></app-icon>
        </button>
    </div>
    <div #editable class="editable" contenteditable="true" (input)="onInput()"></div>
</div>
