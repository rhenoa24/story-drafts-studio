<div class="fields">
    <label>
        <span class="eyebrow">Location</span>
        <input type="text" [ngModel]="block.locationName" (ngModelChange)="patch.emit({ locationName: $event })" />
    </label>
    <label>
        <span class="eyebrow">Point of View</span>
        <input type="text" [ngModel]="block.pointOfView" (ngModelChange)="patch.emit({ pointOfView: $event })" />
    </label>
    <label>
        <span class="eyebrow">Background</span>
        <input type="text" [ngModel]="block.backgroundLabel"
            (ngModelChange)="patch.emit({ backgroundLabel: $event })" />
    </label>
</div>
