@if (chapter(); as chapter) {
<div class="page">
    <div class="page-head">
        <div>
            <span class="eyebrow">Editing Chapter</span><br>
            <input type="text" class="title-input" [ngModel]="chapter.title"
                (ngModelChange)="store.renameChapter(chapter.id, $event)" />
        </div>
        <div class="page-head-actions">
            <a class="btn subtle" routerLink="/">
                <app-icon icon="arrowLeft"></app-icon>
            </a>
            <a class="btn primary" [routerLink]="['/read', chapter.id]">
                <app-icon icon="read"></app-icon>
            </a>
        </div>
    </div>

    <ul class="blocks">
        @for (block of chapter.blocks; track block.id; let i = $index) {
        <li class="block-card" [attr.data-type]="block.type">
            <div class="spine">{{ BLOCK_LABEL[block.type] }}</div>
            <div class="block-body">
                <div class="block-toolbar">
                    <button class="btn subtle" [disabled]="i === 0" (click)="store.moveBlock(chapter.id, i, i - 1)">
                        <app-icon icon="arrowUp"></app-icon>
                    </button>
                    <button class="btn subtle" [disabled]="i === chapter.blocks.length - 1"
                        (click)="store.moveBlock(chapter.id, i, i + 1)">
                        <app-icon icon="arrowDown"></app-icon>
                    </button>
                    <span class="spacer"></span>
                    <button class="btn danger" (click)="store.removeBlock(chapter.id, block.id)">
                        <app-icon icon="delete"></app-icon>
                    </button>
                </div>

                @switch (block.type) {
                @case ('scene') {
                <app-scene-block-editor [block]="block" (patch)="store.updateBlock(chapter.id, block.id, $event)" />
                }
                @case ('narration') {
                <app-narration-block-editor [block]="block" (patch)="store.updateBlock(chapter.id, block.id, $event)" />
                }
                @case ('dialogue') {
                <app-dialogue-block-editor [block]="block" [characters]="store.characters()"
                    (patch)="store.updateBlock(chapter.id, block.id, $event)" />
                }
                }
            </div>
        </li>
        }
    </ul>

    <div class="add-toolbar">
        <span class="eyebrow">Add block</span>
        <button class="btn scene" (click)="add('scene')">+ Scene</button>
        <button class="btn narration" (click)="add('narration')">+ Narration</button>
        <button class="btn dialogue" (click)="add('dialogue')">+ Dialogue</button>
    </div>
</div>
} @else {
<p class="empty">Chapter not found.</p>
}
